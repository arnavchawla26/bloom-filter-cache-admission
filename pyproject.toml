[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-admission"
version = "0.1.0"
description = "TinyLFU-style, frequency-aware cache admission policy toolkit and benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cacheadmit = "cache_admission.cli:main"

[tool.setuptools.packages.find]
include = ["cache_admission*"]
